plugins {
    id 'application'  // ./gradlew run 사용
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)  // Java 21로 빌드
    }
}

repositories {
    mavenCentral()  // 라이브러리 다운로드 저장소
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'  // JSON 처리 라이브러리

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'  // 테스트 라이브러리
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'eai.Main'  // ./gradlew run 시작 클래스
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'  // 한글 주석 깨짐 방지
}

test {
    useJUnitPlatform()  // JUnit 5로 테스트 실행
}
