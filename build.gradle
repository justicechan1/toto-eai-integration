plugins {
    id 'application'  // ./gradlew run 사용
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)  // Java 21로 빌드
    }
}

repositories {
    mavenCentral()  // 라이브러리 다운로드 저장소
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'  // JSON 처리 라이브러리
    implementation 'com.oracle.database.jdbc:ojdbc11:23.4.0.24.05'  // Oracle JDBC 드라이버
    implementation 'commons-net:commons-net:3.11.1'  // FTP 클라이언트

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'  // 테스트 라이브러리
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2:2.2.224'  // 테스트용 메모리 DB (제공 DB는 DELETE 불가라 테스트에 쓰지 않음)
}

application {
    mainClass = 'eai.Main'  // ./gradlew run 시작 클래스
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'  // 한글 주석 깨짐 방지
}

test {
    useJUnitPlatform()  // JUnit 5로 테스트 실행
}
